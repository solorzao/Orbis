name: Events repro

# Measures GDELT Events ingestion against CI's throwaway Postgres. Run by hand
# only (once per PR that changes the events code; record the run in the PR):
# never a required check. GDELT files are downloaded on the runner only. It
# fails only on a format problem in GDELT's data, never on a network failure.
# The input reaches the shell only through env, checked as an integer from 1 to
# 96; the script bounds it too. No pip cache: a dispatched run never writes one
# that CI or Deploy restore.
on:
  workflow_dispatch:
    inputs:
      files:
        description: "15-minute export files to ingest (1 to 96; 96 = a day)"
        type: number
        default: 96

permissions:
  contents: read

jobs:
  repro:
    name: Events ingestion repro
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16-bookworm
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install PostGIS in the database service
        run: >-
          docker exec ${{ job.services.postgres.id }} sh -c
          "apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-16-postgis-3"
      - name: Apply database migrations
        working-directory: .
        run: |
          set -euo pipefail
          for f in database/migrations/*.sql; do
            docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1 -q < "$f"
          done
      - name: Ingest GDELT exports and measure
        run: |
          set -euo pipefail
          case "$FILES" in ''|*[!0-9]*) echo "files must be a positive integer" >&2; exit 1;; esac
          if [ "$FILES" -lt 1 ] || [ "$FILES" -gt 96 ]; then
            echo "files must be from 1 to 96" >&2; exit 1
          fi
          python -m scripts.events_repro --files "$FILES"
        env:
          FILES: ${{ inputs.files }}
          ORBIS_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
