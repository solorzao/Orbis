name: Deploy

on:
  push:
    branches: [main]

# Only allow one deployment at a time
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            database:
              - 'database/**'

  build-and-push:
    name: Build & Push Docker Image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orbis-api:latest
            ghcr.io/${{ github.repository_owner }}/orbis-api:${{ github.sha }}

  deploy-backend:
    name: Deploy Backend to Azure
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: rg-orbis
          containerAppName: orbis-api
          imageToDeploy: ghcr.io/${{ github.repository_owner }}/orbis-api:${{ github.sha }}

  run-migrations:
    name: Run Database Migrations
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Wait for database connectivity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for i in 1 2 3 4 5; do
            if psql "$DATABASE_URL" -c "SELECT 1" > /dev/null 2>&1; then
              echo "Database reachable on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Could not connect to database after 5 attempts"
          exit 1

      - name: Run pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          # Ensure tracking table exists (idempotent)
          psql "$DATABASE_URL" -f database/migrations/005_migration_tracking.sql

          # Run only unapplied migrations in order
          for f in database/migrations/*.sql; do
            fname=$(basename "$f")
            already=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM schema_migrations WHERE filename = '$fname'" 2>/dev/null || echo "")
            if [ "$already" != "1" ]; then
              echo "Applying: $fname"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              psql "$DATABASE_URL" -c "INSERT INTO schema_migrations (filename) VALUES ('$fname')"
              echo "Applied: $fname"
            else
              echo "Skipping (already applied): $fname"
            fi
          done
