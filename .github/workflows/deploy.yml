name: Deploy

on:
  push:
    branches: [main]
    # Nothing to deploy when a push changes only docs
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # Manual run deploys every component regardless of what changed
  workflow_dispatch:

# Only allow one deployment at a time
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # OIDC login to Azure (no stored credentials)

env:
  RESOURCE_GROUP: rg-orbis
  ML_FUNCTION_APP: orbis-ml-classify

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            functions:
              - 'functions/**'

  build-and-push:
    name: Build & Push Docker Image
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orbis-api:latest
            ghcr.io/${{ github.repository_owner }}/orbis-api:${{ github.sha }}

  deploy-backend:
    name: Deploy Backend to Azure
    # After the migrations, so new code never runs against a schema without its
    # columns; a failed migration blocks the deploy. Skipped, as before, when no
    # image was built (run-migrations always runs, so it never skips this).
    needs: [build-and-push, run-migrations]
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: orbis-api
          imageToDeploy: ghcr.io/${{ github.repository_owner }}/orbis-api:${{ github.sha }}

  deploy-functions:
    name: Deploy ML Functions to Azure
    needs: changes
    if: needs.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Functions (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.ML_FUNCTION_APP }}
          package: functions/ml-classify
          sku: flexconsumption
          remote-build: true
      - name: Sync API host key from Key Vault
        run: |
          KV=$(az keyvault list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          KEY=$(az keyvault secret show --vault-name "$KV" --name ml-functions-key --query value -o tsv)
          echo "::add-mask::$KEY"
          az functionapp keys set -g "$RESOURCE_GROUP" -n "$ML_FUNCTION_APP" \
            --key-type functionKeys --key-name orbis-api --key-value "$KEY" -o none

  # Every run, not only when database/** changed: a run waiting in the deploy
  # concurrency group is cancelled when a newer one queues, and the newer run's
  # change filter sees only its own push, so a migration could be skipped for
  # good. Applied migrations are tracked in schema_migrations and skipped.
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read DATABASE_URL from Key Vault
        run: |
          KV=$(az keyvault list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          URL=$(az keyvault secret show --vault-name "$KV" --name database-url --query value -o tsv)
          echo "::add-mask::$URL"
          echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
      - name: Install PostgreSQL client
        # ubuntu-latest ships psql (postgresql-client-16); install only if it's gone.
        run: command -v psql > /dev/null || sudo apt-get install -y postgresql-client

      - name: Wait for database connectivity
        run: |
          for i in 1 2 3 4 5; do
            if psql "$DATABASE_URL" -c "SELECT 1" > /dev/null 2>&1; then
              echo "Database reachable on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Could not connect to database after 5 attempts"
          exit 1

      - name: Run pending migrations
        run: |
          set -euo pipefail

          # Ensure tracking table exists (idempotent)
          psql "$DATABASE_URL" -f database/migrations/005_migration_tracking.sql

          # Run only unapplied migrations in order
          for f in database/migrations/*.sql; do
            fname=$(basename "$f")
            already=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM schema_migrations WHERE filename = '$fname'" 2>/dev/null || echo "")
            if [ "$already" != "1" ]; then
              echo "Applying: $fname"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              psql "$DATABASE_URL" -c "INSERT INTO schema_migrations (filename) VALUES ('$fname') ON CONFLICT (filename) DO NOTHING"
              echo "Applied: $fname"
            else
              echo "Skipping (already applied): $fname"
            fi
          done
