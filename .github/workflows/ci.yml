name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # the change filter lists the PR's files through the API

# A newer push to the same PR cancels the run it supersedes
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Each job runs only when something it reads changed, so a docs-only PR runs
  # nothing and a backend-only PR skips E2E (which runs no backend). The frontend
  # unit tests read backend/app and docs/redesign files for parity checks, and
  # the backend tests read the frontend/e2e contract fixtures. Editing this
  # workflow runs everything, and so does a filter error or a PR past the
  # 3000 files the API lists, so a gap in the listing never skips a check.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.filter.outcome != 'success' || github.event.pull_request.changed_files >= 3000 }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        continue-on-error: true
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            frontend:
              - *workflow
              - 'frontend/**'
              - 'backend/app/**'
              - 'docs/redesign/**'
            e2e:
              - *workflow
              - 'frontend/**'
            backend:
              - *workflow
              - 'backend/**'
              - 'database/**'
              - 'scripts/**'
              - 'frontend/e2e/**'
            infra:
              - *workflow
              - 'infra/**'

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.e2e == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    # A throwaway PostgreSQL 16 for the opt-in database tests (ORBIS_TEST_DATABASE_URL).
    # pgvector's image is Debian bookworm, so PostGIS installs from its PGDG apt
    # repo; postgis/postgis:16 images are bullseye, whose PGDG repo is archived.
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16-bookworm
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest pytest-asyncio
      - run: ruff check app/
      - run: ruff format --check app/
      - run: python -c "from app.main import app; print('Import check passed')"
      - name: Install PostGIS in the database service
        run: >-
          docker exec ${{ job.services.postgres.id }} sh -c
          "apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-16-postgis-3"
      - name: Apply database migrations
        working-directory: .
        run: |
          set -euo pipefail
          for f in database/migrations/*.sql; do
            echo "Applying: $(basename "$f")"
            docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1 -q < "$f"
          done
      - run: python -m pytest tests/ -v
        env:
          ORBIS_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

  terraform:
    name: Terraform Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.infra == 'true'
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
