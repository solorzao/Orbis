name: CI

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway PostgreSQL 16 for the opt-in database tests (ORBIS_TEST_DATABASE_URL).
    # pgvector's image is Debian bookworm, so PostGIS installs from its PGDG apt
    # repo; postgis/postgis:16 images are bullseye, whose PGDG repo is archived.
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16-bookworm
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest pytest-asyncio
      - run: ruff check app/
      - run: ruff format --check app/
      - run: python -c "from app.main import app; print('Import check passed')"
      - name: Install PostGIS in the database service
        run: >-
          docker exec ${{ job.services.postgres.id }} sh -c
          "apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-16-postgis-3"
      - name: Apply database migrations
        working-directory: .
        run: |
          set -euo pipefail
          for f in database/migrations/*.sql; do
            echo "Applying: $(basename "$f")"
            docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1 -q < "$f"
          done
      - name: "REPRO order 1: after the #101 and #106 tests"
        continue-on-error: true
        run: python -m pytest -v -p no:randomly tests/test_threads_db.py tests/test_thread_synopsis_db.py tests/test_search_real_names_db.py
        env:
          ORBIS_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      - name: "REPRO order 2: before them"
        continue-on-error: true
        run: python -m pytest -v -p no:randomly tests/test_search_real_names_db.py tests/test_threads_db.py tests/test_thread_synopsis_db.py
        env:
          ORBIS_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      - name: "REPRO order 3: after a vacuum of the names tables, as autovacuum may run"
        continue-on-error: true
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "VACUUM kg_nodes, kg_entity_names, thread_members"
          python -m pytest -v -p no:randomly tests/test_search_real_names_db.py
        env:
          ORBIS_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      - name: "REPRO order 4: the whole suite"
        continue-on-error: true
        run: python -m pytest tests/ -v
        env:
          ORBIS_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

  terraform:
    name: Terraform Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
