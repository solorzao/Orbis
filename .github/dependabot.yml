version: 2

# Minor and patch updates arrive as one grouped PR per ecosystem; each major
# stays its own PR so a breaking change is reviewed alone. The cooldown only
# delays the PRs Dependabot opens: it proposes no release under a week old. It
# can't hold back what resolves outside those PRs. A floating tag (the
# actions/* steps' @v7) takes a release the day it ships, and so does any
# package left unpinned. So the third-party actions are pinned by commit SHA,
# backend/requirements.txt pins every package, and frontend/package-lock.json
# locks the npm tree. Security updates skip both the cooldown and these groups.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # github-actions supports only default-days, not the per-semver keys
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
